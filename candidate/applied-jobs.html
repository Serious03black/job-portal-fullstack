<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Applied Jobs | AXYTES Candidate Portal</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    body { background: var(--gray-50); }
    .app-card { background: white; border-radius: var(--radius-md); padding: 22px 24px; border: 1.5px solid var(--gray-100); margin-bottom: 14px; transition: var(--transition); }
    .app-card:hover { border-color: var(--primary-light); box-shadow: var(--shadow-md); }
    .timeline-tracker { display: flex; gap: 0; margin-top: 16px; }
    .tt-step { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; }
    .tt-step:not(:last-child)::after { content: ''; position: absolute; top: 12px; left: 50%; width: 100%; height: 2px; background: var(--gray-200); z-index: 0; }
    .tt-step.done:not(:last-child)::after { background: var(--success); }
    .tt-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--gray-200); background: white; z-index: 1; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; }
    .tt-step.done .tt-dot { background: var(--success); border-color: var(--success); color: white; }
    .tt-step.current .tt-dot { background: var(--primary-light); border-color: var(--primary-light); color: white; box-shadow: 0 0 0 3px rgba(37,99,235,0.2); }
    .tt-label { font-size: 0.68rem; color: var(--gray-400); margin-top: 6px; text-align: center; }
    .tt-step.done .tt-label, .tt-step.current .tt-label { color: var(--primary-light); font-weight: 600; }
  </style>
</head>
<body>
<div class="dashboard-layout">
  <nav class="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo-icon">AX</div><div class="sidebar-logo-text"><span>AXYTES</span><span>Candidate Portal</span></div></div>
    <div class="sidebar-nav">
      <a class="sidebar-link" href="dashboard.html"><span class="icon">🏠</span> Dashboard</a>
      <a class="sidebar-link" href="profile.html"><span class="icon">👤</span> My Profile</a>
      <a class="sidebar-link" href="job-search.html"><span class="icon">🔍</span> Search Jobs</a>
      <a class="sidebar-link active" href="applied-jobs.html"><span class="icon">📋</span> Applied Jobs</a>
      <a class="sidebar-link" href="interviews.html"><span class="icon">📅</span> Interviews</a>
      <a class="sidebar-link" href="resume.html"><span class="icon">📄</span> Resume / CV</a>
      <a class="sidebar-link" href="notifications.html"><span class="icon">🔔</span> Notifications</a>
      <a class="sidebar-link" href="login.html" onclick="localStorage.removeItem('candidateSession')"><span class="icon">🚪</span> Logout</a>
    </div>
    <div class="sidebar-footer"><div class="sidebar-user"><div class="sidebar-user-avatar" id="avatarInitials">CU</div><div class="sidebar-user-info"><div class="sidebar-user-name" id="sidebarName">Candidate</div><div class="sidebar-user-role">Job Seeker</div></div></div></div>
  </nav>

  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title">Applied Jobs</div>
      <div class="topbar-actions"><a href="job-search.html" class="btn btn-primary btn-sm">+ Apply More Jobs</a></div>
    </div>

    <div class="page-content">
      <!-- Summary -->
      <div class="stat-cards" style="margin-bottom:24px">
        <div class="stat-card"><div class="stat-card-icon blue">📋</div><div class="stat-card-info"><div class="stat-card-value">8</div><div class="stat-card-label">Total Applications</div></div></div>
        <div class="stat-card"><div class="stat-card-icon orange">⏳</div><div class="stat-card-info"><div class="stat-card-value">3</div><div class="stat-card-label">Under Review</div></div></div>
        <div class="stat-card"><div class="stat-card-icon green">✅</div><div class="stat-card-info"><div class="stat-card-value">3</div><div class="stat-card-label">Shortlisted</div></div></div>
        <div class="stat-card"><div class="stat-card-icon purple">📅</div><div class="stat-card-info"><div class="stat-card-value">1</div><div class="stat-card-label">Interview Scheduled</div></div></div>
      </div>

      <!-- Filter Tabs -->
      <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap" id="filterTabs">
        <button class="btn btn-primary btn-sm" onclick="filterApps('all',this)">All (8)</button>
        <button class="btn btn-outline btn-sm" onclick="filterApps('review',this)">Under Review (3)</button>
        <button class="btn btn-outline btn-sm" onclick="filterApps('shortlisted',this)">Shortlisted (3)</button>
        <button class="btn btn-outline btn-sm" onclick="filterApps('interview',this)">Interview (1)</button>
        <button class="btn btn-outline btn-sm" onclick="filterApps('rejected',this)">Rejected (1)</button>
      </div>

      <div id="applicationsList"></div>
    </div>
  </div>
</div>

<script>
  const session = JSON.parse(localStorage.getItem('candidateSession') || '{}');
  if (!session.email) window.location.href = 'login.html';
  const name = session.name || 'Candidate';
  document.getElementById('sidebarName').textContent = name;
  document.getElementById('avatarInitials').textContent = name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);

  const applications = [
    { id:1, title:'Data Entry Operator', company:'Confidential MNC', loc:'Navi Mumbai', type:'Contract', salary:'₹12–18K', applied:'20 Sep 2026', status:'interview', steps:[true,true,true,false,false], interview:'05 Oct 2026, 11:00 AM — Online (Zoom)' },
    { id:2, title:'Sales Executive', company:'FMCG Leader', loc:'Mumbai', type:'Full-time', salary:'₹20–30K', applied:'25 Sep 2026', status:'shortlisted', steps:[true,true,false,false,false] },
    { id:3, title:'Production Supervisor', company:'Precision Industries', loc:'Pune', type:'Full-time', salary:'₹25–35K', applied:'28 Sep 2026', status:'review', steps:[true,false,false,false,false] },
    { id:4, title:'HR Executive', company:'IT Company', loc:'Thane', type:'Full-time', salary:'₹20–28K', applied:'22 Sep 2026', status:'shortlisted', steps:[true,true,false,false,false] },
    { id:5, title:'Machine Operator', company:'Auto Parts Mfg', loc:'Pune', type:'Full-time', salary:'₹15–22K', applied:'15 Sep 2026', status:'rejected', steps:[true,false,false,false,false] },
    { id:6, title:'Warehouse Executive', company:'Logistics Co.', loc:'Bhiwandi', type:'Full-time', salary:'₹18–25K', applied:'01 Oct 2026', status:'review', steps:[true,false,false,false,false] },
    { id:7, title:'Accounts Executive', company:'Finance Ltd.', loc:'Mumbai', type:'Full-time', salary:'₹18–26K', applied:'29 Sep 2026', status:'shortlisted', steps:[true,true,false,false,false] },
    { id:8, title:'Store Keeper', company:'Pharma Co.', loc:'Nashik', type:'Full-time', salary:'₹16–22K', applied:'02 Oct 2026', status:'review', steps:[true,false,false,false,false] },
  ];

  const statusInfo = {
    review: { label:'Under Review', badge:'badge-warning' },
    shortlisted: { label:'Shortlisted ✓', badge:'badge-success' },
    interview: { label:'Interview Scheduled', badge:'badge-info' },
    rejected: { label:'Not Proceeded', badge:'badge-danger' },
    placed: { label:'Placed 🎉', badge:'badge-success' },
  };

  const stepLabels = ['Applied', 'Reviewed', 'Shortlisted', 'Interview', 'Placed'];

  function renderApps(apps) {
    document.getElementById('applicationsList').innerHTML = apps.map(a => {
      const si = statusInfo[a.status];
      const stepsHtml = `<div class="timeline-tracker">${a.steps.map((s,i) => {
        const idx = a.steps.indexOf(true) >= 0 ? a.steps.lastIndexOf(true) : -1;
        const cls = s ? 'done' : (i === idx + 1 ? 'current' : '');
        return `<div class="tt-step ${cls}"><div class="tt-dot">${s?'✓':i+1}</div><div class="tt-label">${stepLabels[i]}</div></div>`;
      }).join('')}</div>`;

      return `<div class="app-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">
          <div>
            <h4 style="color:var(--primary);margin-bottom:4px">${a.title}</h4>
            <div style="color:var(--gray-500);font-size:0.85rem">${a.company} • ${a.loc} • ${a.type}</div>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            <span class="badge ${si.badge}">${si.label}</span>
          </div>
        </div>
        <div style="display:flex;gap:24px;margin:12px 0;flex-wrap:wrap">
          <span style="font-size:0.82rem;color:var(--gray-400)">💰 ${a.salary}/mo</span>
          <span style="font-size:0.82rem;color:var(--gray-400)">📅 Applied: ${a.applied}</span>
        </div>
        ${stepsHtml}
        ${a.interview ? `<div style="margin-top:14px;background:linear-gradient(135deg,#d1fae5,#a7f3d0);border-radius:8px;padding:12px 16px;font-size:0.85rem;color:#065f46"><strong>📅 Interview Details:</strong> ${a.interview}</div>` : ''}
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:14px">
          ${a.status === 'interview' ? `<a href="interviews.html" class="btn btn-primary btn-sm">View Interview Details</a>` : ''}
          <button class="btn btn-outline btn-sm" style="color:var(--danger);border-color:var(--danger)" onclick="withdrawApp(${a.id})">Withdraw</button>
        </div>
      </div>`;
    }).join('');
  }

  function filterApps(status, btn) {
    document.querySelectorAll('#filterTabs button').forEach(b => { b.className = 'btn btn-outline btn-sm'; });
    btn.className = 'btn btn-primary btn-sm';
    const filtered = status === 'all' ? applications : applications.filter(a => a.status === status);
    renderApps(filtered);
  }

  function withdrawApp(id) {
    if (confirm('Are you sure you want to withdraw this application?')) {
      alert('Application withdrawn successfully.');
    }
  }

  renderApps(applications);
</script>
</body>
</html>
